#!/usr/sbin/nft -f
# =============================================================================
#  Int-Router - vermittelt Client <-> Client (F12) und ist dort Kontrollpunkt.
#  Interfaces: eth1 Router-Link | eth2 Client-Netz
#  Umsetzt: F12 (SF-15), SF-14 (Sperrliste fuer Clients)
# =============================================================================
flush ruleset

define CLIENT_IF = "eth2"

table inet router {
    set blocklist { type ipv4_addr; flags timeout; }

    chain preraw {
        type filter hook prerouting priority -300; policy accept;
        ip saddr @blocklist counter log prefix "ROUTER-BLOCK " limit rate 10/second drop
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        ct state established,related accept

        # Client <-> Client laeuft als "in eth2 / out eth2" (Proxy-ARP am Router).
        # 1) Scan-Bremse: mehr als 10 neue Verbindungen/s je Quelle -> verwerfen
        iifname $CLIENT_IF oifname $CLIENT_IF ct state new \
            meter c2c_scan { ip saddr limit rate over 10/second burst 20 packets } \
            counter log prefix "ROUTER-SCAN " drop
        # 2) sonst erlaubt, aber jede neue Verbindung protokollieren
        iifname $CLIENT_IF oifname $CLIENT_IF ct state new \
            counter log prefix "ROUTER-C2C " limit rate 20/second accept
        # Routing Richtung Inner-FW / Internet laeuft normal weiter (policy accept).
    }
}
