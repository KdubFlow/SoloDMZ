#!/usr/sbin/nft -f
# =============================================================================
#  Edge-FW (Perimeter) - Default-Deny, NAT, Sperrliste
#  Interfaces: eth1 Uplink | eth2 F-DMZ(rproxy) | eth3 B1(web)
#              eth4 Transit | eth5 B2(vpn-gw) | eth6 H-DMZ(honeypot)
#  Umsetzt: F01-F09, F13, F14, SF-01/02/04/13/14
# =============================================================================
flush ruleset

define UPLINK = "eth1"
define FDMZ   = "eth2"
define B1DMZ  = "eth3"
define TRANSIT= "eth4"
define B2DMZ  = "eth5"
define HDMZ   = "eth6"

define RPROXY = 10.0.10.2
define WEB    = 10.0.10.18
define VPNGW  = 10.0.10.34
define HPOT   = 10.0.10.50
define PUBIP  = 198.51.100.2
define INETSRV= 203.0.113.30
define CLIENT = 10.0.20.0/24
define BRANCH = 10.50.0.0/24

table inet edge {
    # Automatisch ablaufende Sperrliste (SF-14, von scripts/responder.sh gefuellt)
    set blocklist {
        type ipv4_addr
        flags timeout
    }

    # --- Sperrliste zuerst, noch vor NAT ---
    chain preraw {
        type filter hook prerouting priority -300; policy accept;
        ip saddr @blocklist counter log prefix "EDGE-BLOCK " limit rate 10/second drop
    }

    # --- NAT ---
    chain dnat {
        type nat hook prerouting priority dstnat; policy accept;
        iifname $UPLINK ip daddr $PUBIP tcp dport 443   dnat ip to $RPROXY:443
        iifname $UPLINK ip daddr $PUBIP tcp dport 80    dnat ip to $RPROXY:80
        iifname $UPLINK ip daddr $PUBIP udp dport 51820 dnat ip to $VPNGW:51820
        iifname $UPLINK ip daddr $PUBIP tcp dport 22    dnat ip to $HPOT:2222   # Honeypot-Koeder
    }
    chain snat {
        type nat hook postrouting priority srcnat; policy accept;
        # Clients und Zweigstelle ins Internet: hinter der oeffentlichen IP verstecken
        oifname $UPLINK ip saddr $CLIENT snat ip to $PUBIP
        oifname $UPLINK ip saddr $BRANCH snat ip to $PUBIP
        # DMZ-Dienste zum Update-/Internet-Server (F13)
        oifname $UPLINK ip saddr { $RPROXY, $WEB } ip daddr $INETSRV snat ip to $PUBIP
    }

    # --- Schutz der Firewall selbst ---
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept
        # nur ICMP-Echo aus direkt angeschlossenen Segmenten, mengenbegrenzt
        icmp type echo-request limit rate 5/second accept
        counter log prefix "EDGE-IN-DROP " limit rate 5/second drop
    }

    # --- Durchgangsverkehr: Kommunikationsmatrix ---
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop

        # F01/F02 Internet -> Webanwendung (nach DNAT auf rproxy)
        iifname $UPLINK ip daddr $RPROXY tcp dport { 80, 443 } ct state new log prefix "EDGE-NEW " accept
        # F03 Zweigstelle -> VPN-GW (nur von ro-gw)
        iifname $UPLINK ip saddr 203.0.113.40 ip daddr $VPNGW udp dport 51820 ct state new log prefix "EDGE-NEW " accept
        # F04 Internet -> Honeypot
        iifname $UPLINK ip daddr $HPOT tcp dport 2222 ct state new log prefix "EDGE-NEW " accept
        # F05 rproxy -> web (Klartext-HTTP, von IPS 1 geprueft)
        iifname $FDMZ ip saddr $RPROXY oifname $B1DMZ ip daddr $WEB tcp dport 80 ct state new log prefix "EDGE-NEW " accept
        # F06 Zweigstelle -> rproxy (nach VPN-Entschluesselung)
        iifname $B2DMZ ip saddr $BRANCH ip daddr $RPROXY tcp dport 443 ct state new log prefix "EDGE-NEW " accept
        # F07 Zweigstelle -> Client-Netz
        iifname $B2DMZ ip saddr $BRANCH ip daddr $CLIENT tcp dport 445 ct state new log prefix "EDGE-NEW " accept
        iifname $B2DMZ ip saddr $BRANCH ip daddr $CLIENT icmp type echo-request accept
        # F08 Client -> Internet
        iifname $TRANSIT ip saddr $CLIENT oifname $UPLINK tcp dport { 80, 443 } ct state new log prefix "EDGE-NEW " accept
        iifname $TRANSIT ip saddr $CLIENT oifname $UPLINK icmp type echo-request accept
        # F09 Client -> rproxy (immer ueber WAF)
        iifname $TRANSIT ip saddr $CLIENT ip daddr $RPROXY tcp dport 443 ct state new log prefix "EDGE-NEW " accept
        # F13 DMZ -> inet-server (Updates)
        ip saddr { $RPROXY, $WEB } ip daddr $INETSRV tcp dport { 80, 443 } ct state new log prefix "EDGE-NEW " accept
        # F14 Zweigstelle -> Internet (Full Tunnel, surft ueber die Zentrale)
        iifname $B2DMZ ip saddr $BRANCH oifname $UPLINK tcp dport { 80, 443 } ct state new log prefix "EDGE-NEW " accept
        iifname $B2DMZ ip saddr $BRANCH oifname $UPLINK icmp type echo-request accept

        # alles andere: verwerfen und protokollieren
        counter log prefix "EDGE-DROP " limit rate 10/second drop
    }
}
