#!/usr/sbin/nft -f
# =============================================================================
#  Backend-FW - schuetzt das SOC. Kein Durchgangsverkehr.
#  Logs erreichen das SIEM ueber die VM (SF-11), nicht ueber ein Labornetz.
#  Interfaces: eth1 Backend-Link | eth2 Backend-Netz
# =============================================================================
flush ruleset

table inet backend {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        icmp type echo-request limit rate 5/second accept
        counter log prefix "BACKEND-IN-DROP " limit rate 5/second drop
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        # Standardmaessig kein Weg ins oder aus dem SOC ueber das Netz.
        counter log prefix "BACKEND-DROP " limit rate 5/second drop
    }
}
