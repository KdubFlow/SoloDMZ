#!/usr/sbin/nft -f
# =============================================================================
#  ro-gw - Gateway der Zweigstelle (Site-to-Site, Full Tunnel)
#  Interfaces: eth1 Internet | eth2 Zweigstellen-LAN | wg0 Tunnel
#  Default-Deny: aus dem Internet erreicht niemand die Zweigstelle.
# =============================================================================
flush ruleset

define INET   = "eth1"
define LAN    = "eth2"
define TUN    = "wg0"
define PUBIP  = 198.51.100.2

table inet rogw {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        iifname $TUN accept
        # eigener WireGuard-Endpunkt
        iifname $INET udp dport 51820 accept
        iifname $LAN icmp type echo-request limit rate 5/second accept
        counter log prefix "ROGW-IN-DROP " limit rate 5/second drop
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        # LAN -> Tunnel (Full Tunnel: alles in die Zentrale)
        iifname $LAN oifname $TUN accept
        # Tunnel -> LAN (Rueckverkehr)
        iifname $TUN oifname $LAN accept
        counter log prefix "ROGW-DROP " limit rate 5/second drop
    }
}
