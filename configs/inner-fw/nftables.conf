#!/usr/sbin/nft -f
# =============================================================================
#  Inner-FW - schuetzt Client-Netz und (ueber Backend-Link) das SOC
#  Interfaces: eth1 Transit | eth2 Router-Link | eth3 Backend-Link
#  Umsetzt: F07, F08, F09, SF-01/04/14/16 (Exfil-Bremse)
# =============================================================================
flush ruleset

define TRANSIT = "eth1"
define ROUTER  = "eth2"
define BACKEND = "eth3"
define CLIENT  = 10.0.20.0/24
define BRANCH  = 10.50.0.0/24
define RPROXY  = 10.0.10.2
define EXFIL_MAX = 20971520   # 20 MB je Verbindung (SF-16)

table inet inner {
    set blocklist { type ipv4_addr; flags timeout; }

    chain preraw {
        type filter hook prerouting priority -300; policy accept;
        ip saddr @blocklist counter log prefix "INNER-BLOCK " limit rate 10/second drop
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname "lo" accept
        icmp type echo-request limit rate 5/second accept
        counter log prefix "INNER-IN-DROP " limit rate 5/second drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop

        # Exfil-Bremse (SF-16): Client -> Internet, Verbindung ueber 20 MB kappen
        iifname $ROUTER ip saddr $CLIENT oifname $TRANSIT ct original bytes gt $EXFIL_MAX \
            counter log prefix "INNER-EXFIL " drop

        # F08 Client -> Internet (weiter zur Edge-FW)
        iifname $ROUTER ip saddr $CLIENT oifname $TRANSIT tcp dport { 80, 443 } ct state new log prefix "INNER-NEW " accept
        iifname $ROUTER ip saddr $CLIENT oifname $TRANSIT icmp type echo-request accept
        # F09 Client -> rproxy (ueber WAF)
        iifname $ROUTER ip saddr $CLIENT ip daddr $RPROXY tcp dport 443 ct state new log prefix "INNER-NEW " accept
        # F07 Zweigstelle -> Client (aus dem Transit kommend)
        iifname $TRANSIT ip saddr $BRANCH ip daddr $CLIENT tcp dport 445 ct state new log prefix "INNER-NEW " accept
        iifname $TRANSIT ip saddr $BRANCH ip daddr $CLIENT icmp type echo-request accept

        # Backend-Link: kein Durchgangsverkehr (Logs laufen ueber die VM, nicht uebers Netz)
        oifname $BACKEND counter log prefix "INNER-BACKEND-DROP " limit rate 5/second drop

        counter log prefix "INNER-DROP " limit rate 10/second drop
    }
}
